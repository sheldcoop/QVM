  box: 640                            # SC distribution box plot

VTP_REGISTRATION:
  # Bullseye uses five zones defined by four concentric rings:
  #   inside ring_exceptional ..... BLUE — exceptional
  #   ring_exceptional..ring_excellent — DARK GREEN — excellent
  #   ring_excellent..ring_good .. GREEN — good
  #   ring_good..ring_acceptable . ORANGE — acceptable
  #   outside ring_acceptable .... RED — fail
  ring_exceptional_um: 2.5      # Exceptional boundary (blue ring)
  ring_excellent_um: 5.0        # Excellent boundary (dark green ring)
  ring_good_um: 7.5             # Good boundary (green ring)
  ring_acceptable_um: 10.0      # Acceptable boundary; > this is fail (red)
  # USL values added to the Report sheet (X/Y USL are left blank)
  vtp_usl_um: 10.0         # VtP Distance (SC) upper spec limit (µm)
  outlier_cap_um: 1000.0   # SC values above this (µm) are flagged as outliers
  sc_override_enabled: true          # If true, replace SC with sqrt(DX^2 + DY^2) when mismatch is large
  sc_override_abs_error_um: 100.0    # Minimum absolute mismatch (µm) to allow override
  sc_override_rel_error_pct: 10.0    # Minimum relative mismatch (%) to allow override

PTV_REGISTRATION:
  # USL value added to the Pad-to-Via Report sheet (keyed on PtV Distance).
  ptv_usl_um: 10.0         # PtV Distance upper spec limit (µm) — adjust to taste
  outlier_cap_um: 1000.0   # SC values above this (µm) are flagged as outliers
  sc_override_enabled: true          # If true, replace SC with sqrt(DX^2 + DY^2) when mismatch is large
  sc_override_abs_error_um: 100.0    # Minimum absolute mismatch (µm) to allow override
  sc_override_rel_error_pct: 10.0    # Minimum relative mismatch (%) to allow override

EXCEL_EXPORT:
  panel_map_image: "assets/Panel_Map.png"   # path relative to qvm_dashboard/
  panel_image_cm: 8.5                        # embed size in cm (width = height)

CORE_SHRINKAGE:
  distance_usl_mm: 0.050    # upper spec limit for front↔back offset (mm) — adjust to taste
  outlier_cap_mm: 5.0       # offsets above this are flagged as outliers
  # --- 3-level model thresholds (per-dot residual, classifier, pass/fail) ---
  outlier_um: 50            # per-dot residual above this = outlier / remeasure
  rotation_warn_deg: 0.30   # rotation above this is flagged (fixturing, not shrinkage)
  aniso_ppm: 100            # |Sx-Sy| above this = anisotropic shrinkage
  shrink_ppm: 50            # |scale| above this counts as real shrinkage
  shrink_usl_ppm: 1000      # headline-shrinkage pass/fail spec (Quality Control)
  residual_zones_um:        # per-dot residual colour zones (Distortion Map)
    exceptional: 10
    excellent: 20
    good: 35
    acceptable: 50
  NOMINAL_COORDS:
    UL_1: {x: -222.700, y:  239.875}
    UL_2: {x: -222.700, y:    4.125}
    UL_3: {x:  -22.050, y:    4.125}
    UL_4: {x:  -22.050, y:  239.875}
    LL_1: {x: -222.700, y:   -4.125}
    LL_2: {x: -222.700, y: -239.875}
    LL_3: {x:  -22.050, y: -239.875}
    LL_4: {x:  -22.050, y:   -4.125}
    LR_1: {x:   20.300, y:   -4.125}
    LR_2: {x:   20.300, y: -239.875}
    LR_3: {x:  220.950, y: -239.875}
    LR_4: {x:  220.950, y:   -4.125}
    UR_1: {x:   20.300, y:  239.875}
    UR_2: {x:   20.300, y:    4.125}
    UR_3: {x:  220.950, y:    4.125}
    UR_4: {x:  220.950, y:  239.875}

REGISTRATION_SHRINKAGE:
  # Shrinkage of Pad-to-Via / Via-to-Pad files (the Shrinkage tab). Units: mm.
  # Which measured centre the calculation uses, per file type: via | pad
  measured_point:
    Pad to Via: via
    Via to Pad: via
  outlier_ppm: 50          # a quadrant this far from the panel average raises an alert
  usl_ppm: null            # optional pass/fail limit on |shrinkage| in ppm; null = report only
  # A quadrant further than this from its design size is not shrinkage: the design is
  # that of another product, or the file is wrong. No result is reported then.
  max_plausible_ppm: 2000
  # Design size of one quadrant (mm): the distance between its corner points in X
  # and in Y. All four quadrants have the same size, and this is all the
  # calculation needs. These are the defaults of the two boxes in the sidebar
  # ("Shrinkage design size"); a value typed there replaces them for the session.
  # C4F: from sample_data/QP_Coordinate_Commonality_Analysis.xlsx (all four
  # datasets there give 232.5 x 193.9).
  design_quadrant_mm: {x: 232.5, y: 193.9}
  # Gap between the quadrants (mm). Only used to draw the Shrinkage Map; it has
  # no effect on any number.
  map_gap_mm: {x: 9.75, y: 50.1}

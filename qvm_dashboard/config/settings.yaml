# Settings for the QVM Database Analysis dashboard.
# Only the values actually consumed by the app remain:
#   UI_STRINGS.dashboard_title -> page title          (app.py)
#   COLORS.*                   -> CSS theme variables (app.py load_css)

UI_STRINGS:
  dashboard_title: "QVM Manufacturing Dashboard"

COLORS:
  app_background: "#212121"
  app_text: "#FFFFFF"
  panel_ui: "#B87333"
  panel_ui_hover: "#d48c46"

# All chart layout/sizing/typography lives here (colors of the data series still
# come from src/theme.py). Tweak these to restyle every chart without touching code.
CHART_SETTINGS:
  font_family: "Inter, sans-serif"
  title_size: 18
  title_color: "#FFFFFF"
  watermark_size: 17
  badge_size: 14
  grid_color: "rgba(255,255,255,0.05)"
  axis:
    title_color: "#FFFFFF"   # x/y axis titles (e.g. "Lot Number", value)
    title_size: 16
    tick_color: "#FFFFFF"    # x/y tick labels (lot numbers, values)
    tick_size: 14
    bold: true               # bold axis titles + tick labels
  box:                       # the box-plot "bars"
    height: 700
    box_width: 0.35          # width of each box; spacing follows from this
    jitter: 0.15             # horizontal scatter of the dots
    marker_size: 10
    marker_opacity: 0.9
    mean_label_size: 13
  control:                   # X-bar & S control chart
    height: 950
    marker_size: 8
    subplot_title_size: 14
  trend:                     # Lot-over-lot Trend Analysis chart (white background)
    height: 600
    width: null              # null = responsive (stretch); a number = fixed px
    background: "#FFFFFF"
    ink_color: "#333333"     # text / axis / marker-label colour on white
    grid_color: "#e6e6e6"
    title_size: 18
    axis_title_size: 18
    axis_tick_size: 14
    legend_size: 18
    line_width: 2
    marker_size: 9
    value_labels: true       # show per-lot mean on each point
    label_decimals: 1
    label_position: "top center"
    margin:
      l: 70
      r: 190
      t: 70
      b: 70
    outlier:
      ring_color: "#d62728"
      ring_extra_size: 7
      ring_width: 2
    colors:
      - "#1f77b4"
      - "#ff7f0e"
      - "#2ca02c"
      - "#d62728"
      - "#9467bd"
      - "#8c564b"
      - "#e377c2"
      - "#17becf"
      - "#bcbd22"
      - "#7f7f7f"

  site_bars: 450                      # Per-site SC bar chart
  quiver: 600                         # ABF distortion quiver map
  box: 640                            # SC distribution box plot

VTP_REGISTRATION:
  # Bullseye uses five zones defined by four concentric rings:
  #   inside ring_exceptional ..... BLUE — exceptional
  #   ring_exceptional..ring_excellent — DARK GREEN — excellent
  #   ring_excellent..ring_good .. GREEN — good
  #   ring_good..ring_acceptable . ORANGE — acceptable
  #   outside ring_acceptable .... RED — fail
  ring_exceptional_um: 2.5      # Exceptional boundary (blue ring)
  ring_excellent_um: 5.0        # Excellent boundary (dark green ring)
  ring_good_um: 7.5             # Good boundary (green ring)
  ring_acceptable_um: 10.0      # Acceptable boundary; > this is fail (red)
  # USL values added to the Report sheet (X/Y USL are left blank)
  vtp_usl_um: 10.0         # VtP Distance (SC) upper spec limit (µm)
  outlier_cap_um: 1000.0   # SC values above this (µm) are flagged as outliers

PTV_REGISTRATION:
  # USL value added to the Pad-to-Via Report sheet (keyed on PtV Distance).
  ptv_usl_um: 10.0         # PtV Distance upper spec limit (µm) — adjust to taste
  outlier_cap_um: 1000.0   # SC values above this (µm) are flagged as outliers

EXCEL_EXPORT:
  panel_map_image: "assets/Panel_Map.png"   # path relative to qvm_dashboard/
  panel_image_cm: 8.5                        # embed size in cm (width = height)



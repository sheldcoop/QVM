CHART_COLORS:
  traffic_light_dark_green: "#1e7e3a" # Excellent — inner pass band
  traffic_light_green: "#2ecc71"      # Good — outer pass band
  traffic_light_orange: "#f39c12"     # (legacy, no longer used by the bullseye)
  traffic_light_red: "#e74c3c"        # Critical (<40 points)
  traffic_light_gray: "#999999"       # Unknown/Missing
  chart_background: "#FFFFFF"         # Pure white
  chart_gridlines_visible: false

CHART_HEIGHTS:
  health_status: 550                  # Via/Pad health bar charts
  comparison_plot: 400                # Pad vs Via comparison
  analytics_plot: 600                 # Bullseye, Quiver, Heatmap

CAM_COMPENSATION:
  monitor_ppm: 50.0
  caution_ppm: 120.0
  min_valid_points: 12
  min_valid_ratio: 0.75

VTP_REGISTRATION:
  # Bullseye uses five zones defined by four concentric rings:
  #   inside ring_exceptional ..... BLUE — exceptional
  #   ring_exceptional..ring_excellent — DARK GREEN — excellent
  #   ring_excellent..ring_good .. GREEN — good
  #   ring_good..ring_acceptable . ORANGE — acceptable
  #   outside ring_acceptable .... RED — fail
  ring_exceptional_um: 2.5      # Exceptional boundary (blue ring)
  ring_excellent_um: 5.0        # Excellent boundary (dark green ring)
  ring_good_um: 7.5             # Good boundary (green ring)
  ring_acceptable_um: 10.0      # Acceptable boundary; > this is fail (red)
  point_size: 12           # Scatter point size
  bullseye_axis_half_um: 15.0  # Half-width of bullseye X/Y axes (fixed; outliers report in summary annotation)
  pad_nominal_um: 312.5    # Nominal pad diameter for caption
  via_nominal_um: 20.0     # Nominal via diameter for caption
  annular_ring_min_um: 50.0  # IPC minimum annular ring (caption only)
  ipc_standard: "IPC-6012 Class 2"


